<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#416b3c" />
      <stop offset="60%" stop-color="#2d4c28" />
      <stop offset="100%" stop-color="#1b3318" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.4" r="0.4">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="1" />
      <stop offset="50%" stop-color="#FAD02C" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E67E22" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hillGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B8C51" />
      <stop offset="100%" stop-color="#2D4C28" />
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B6334" />
      <stop offset="100%" stop-color="#1A2F17" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#skyGrad)" />

  <!-- Sun -->
  <circle cx="256" cy="210" r="110" fill="url(#sunGlow)" filter="url(#softGlow)" />
  <circle cx="256" cy="210" r="54" fill="#FFF8E7" />

  <!-- Background Rolling Hills -->
  <path d="M 0,340 Q 130,280 260,330 T 512,320 L 512,512 L 0,512 Z" fill="url(#hillGrad1)" />

  <!-- Foreground Hill -->
  <path d="M 0,390 Q 180,340 340,380 T 512,370 L 512,512 L 0,512 Z" fill="url(#hillGrad2)" />

  <!-- Sprouting Meadow Leaf Emblem -->
  <path d="M 256,360 C 256,300 295,245 345,235 C 345,285 305,340 256,360 Z" fill="#A2D9CE" />
  <path d="M 256,360 C 256,310 220,265 175,255 C 175,300 215,345 256,360 Z" fill="#FAD02C" />
  <path d="M 256,380 L 256,325" stroke="#FFF8E7" stroke-width="6" stroke-linecap="round" />
</svg>
